<svg width="200" height="215" viewBox="0 0 200 215" fill="none" xmlns="http://www.w3.org/2000/svg">
<style>
.petal { transform-box: view-box; transform-origin: 100px 196px; transform: rotate(var(--c));
  animation: bloom 10s infinite; }
@keyframes bloom {
  0%   { transform: rotate(var(--c)); animation-timing-function: cubic-bezier(.45,0,.55,1); }
  30%  { transform: rotate(var(--o)); animation-timing-function: cubic-bezier(.3,0,.5,1); }
  40%  { transform: rotate(var(--f)); animation-timing-function: cubic-bezier(.45,0,.55,1); }
  100% { transform: rotate(var(--c)); }
}
.breathe { transform-box: view-box; transform-origin: 100px 120px; animation: rise 10s infinite; }
@keyframes rise {
  0% { transform: translateY(0); animation-timing-function: cubic-bezier(.45,0,.55,1); }
  30% { transform: translateY(-1.6px); animation-timing-function: cubic-bezier(.3,0,.5,1); }
  40% { transform: translateY(-2.2px); animation-timing-function: cubic-bezier(.45,0,.55,1); }
  100% { transform: translateY(0); }
}
@media (prefers-reduced-motion: reduce) { .petal, .breathe { animation: none; transform: rotate(var(--o)); } .breathe { transform: none; } }
</style>
